services:
  postgres:
    image: postgres:16-alpine
    container_name: webastral-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: webastral
      POSTGRES_PASSWORD: webastral
      POSTGRES_DB: webastral
    volumes:
      - webastral_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webastral -d webastral"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  webastral_pg_data:
